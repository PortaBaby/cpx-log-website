<!DOCTYPE html>
<html>
<head>
  <title>CPX Log Downloader</title>
</head>
<body>

<h1>CPX Log Downloader</h1>

<button onclick="connect()">Connect Device</button>
<button onclick="downloadCSV()">Download Logs</button>

<pre id="log"></pre>

<script>
let port;
let reader;

let logs = [];
let collecting = false;
let currentBoard = "";

// ----------------------------
// UI PRINT
// ----------------------------
function print(msg) {
  document.getElementById("log").textContent += msg + "\n";
}

// ----------------------------
// CONNECT
// ----------------------------
async function connect() {
  try {
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });

    print("Connected to CPX");

    const decoder = new TextDecoderStream();
    port.readable.pipeTo(decoder.writable);
    reader = decoder.readable.getReader();

    readLoop();

  } catch (e) {
    print("Error: " + e);
  }
}

// ----------------------------
// SERIAL READ LOOP
// ----------------------------
let buffer = "";

async function readLoop() {

  while (true) {

    const { value, done } = await reader.read();
    if (done) break;

    buffer += value;

    let lines = buffer.split("\n");
    buffer = lines.pop();

    for (let line of lines) {

      line = line.trim();
      if (!line) continue;

      print(line);

      // ----------------------------
      // START DUMP
      // ----------------------------
      if (line.includes("=== AUTO DUMP ===")) {
        collecting = true;
        logs = [];
        currentBoard = "";
        continue;
      }

      // ----------------------------
      // BOARD ID
      // ----------------------------
      if (line.startsWith("Board:")) {
        currentBoard = line.replace("Board:", "").trim();
        continue;
      }

      // ----------------------------
      // END DUMP
      // ----------------------------
      if (line.includes("=== END DUMP ===")) {
        collecting = false;
        print("✅ Logs captured: " + logs.length);
        continue;
      }

      // ----------------------------
      // DATA HEADER SKIP
      // ----------------------------
      if (line.includes("EventNum") || line.includes("Trigger")) {
        continue;
      }

      // ----------------------------
      // DATA ROWS
      // ----------------------------
      if (collecting) {

        const parts = line.split(",");

        // Expect: EventNum,Trigger,Time
        if (parts.length >= 3) {

          logs.push([
            currentBoard,
            parts[0], // EventNum
            parts[1], // Trigger
            parts[2]  // Time
          ]);
        }
      }
    }
  }
}

// ----------------------------
// DOWNLOAD CSV
// ----------------------------
function downloadCSV() {

  if (logs.length === 0) {
    alert("No logs found. Connect first.");
    return;
  }

  let csv = "Board,EventNum,Trigger,Time(D/H/M)\n";

  logs.forEach(row => {
    csv += row.join(",") + "\n";
  });

  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "CPX_LOG.csv";
  a.click();

  URL.revokeObjectURL(url);

  // OPTIONAL: send clear command to CPX
  if (port && port.writable) {
    const writer = port.writable.getWriter();
    writer.write(new TextEncoder().encode("CLEAR\n"));
    writer.releaseLock();
  }
}
</script>

</body>
</html>
