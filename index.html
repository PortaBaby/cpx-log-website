<!DOCTYPE html>
<html>
<head>
  <title>CPX Log Downloader</title>
</head>
<body>

<h1>CPX Log Downloader</h1>

<button onclick="connect()">Connect Device</button>
<button onclick="downloadCSV()">Download Logs</button>

<pre id="log"></pre>

<script>
let port;
let reader;
let logs = [];
let collecting = false;

function print(msg) {
  document.getElementById("log").textContent += msg + "\n";
}

// CONNECT TO CPX
async function connect() {
  try {
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });

    print("Connected to CPX");

    const decoder = new TextDecoderStream();
    port.readable.pipeTo(decoder.writable);
    reader = decoder.readable.getReader();

    readLoop();

  } catch (e) {
    print("Error: " + e);
  }
}

// READ SERIAL DATA
let buffer = "";

async function readLoop() {
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;

    buffer += value;

    let lines = buffer.split("\n");
    buffer = lines.pop(); // keep incomplete line

    for (let line of lines) {
      line = line.trim();
      if (!line) continue;

      print(line);

      // START OF DUMP
      if (line.includes("=== AUTO DUMP ===")) {
        collecting = true;
        logs = [];
        continue;
      }

      // END OF DUMP
      if (line.includes("=== END DUMP ===")) {
        collecting = false;
        print("✅ Logs captured: " + logs.length);
        continue;
      }

      // HEADER SKIP
      if (line.includes("EventNum") || line.includes("Trigger")) {
        continue;
      }

      // DATA
      if (collecting) {
        const parts = line.split(",");

        // Arduino now sends 3 columns:
        // EventNum,Trigger,Time(D/H/M)
        if (parts.length >= 3) {
          logs.push([
            parts[0],
            parts[1],
            parts[2]
          ]);
        }
      }
    }
  }
}

// DOWNLOAD CSV
function downloadCSV() {
  if (logs.length === 0) {
    alert("No logs found. Connect first.");
    return;
  }

  let csv = "EventNum,Trigger,Time(D/H/M)\n";

  logs.forEach(r => {
    csv += r.join(",") + "\n";
  });

  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "CPX_LOG.csv";
  a.click();

  URL.revokeObjectURL(url);

  // Send CLEAR command to CPX after download
  if (port && port.writable) {
    const writer = port.writable.getWriter();
    writer.write(new TextEncoder().encode("CLEAR\n"));
    writer.releaseLock();
  }
}
</script>

</body>
</html>
